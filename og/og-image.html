<!DOCTYPE html>
<!--
  Source for client/public/og-image.jpg (the link preview card, 1200×630).
  Regenerate from the repo root:

  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --window-size=1200,630 --virtual-time-budget=5000 \
    --screenshot=og.png "file://$PWD/og/og-image.html" && \
    sips -s format jpeg -s formatOptions 88 og.png --out client/public/og-image.jpg && rm og.png
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: #030712;
      color: #f9fafb;
      position: relative;
    }
    .glow-a { position: absolute; width: 620px; height: 620px; left: -160px; top: -220px; border-radius: 50%; background: radial-gradient(circle, rgba(37, 99, 235, 0.35), transparent 65%); }
    .glow-b { position: absolute; width: 700px; height: 700px; right: -200px; bottom: -320px; border-radius: 50%; background: radial-gradient(circle, rgba(59, 130, 246, 0.25), transparent 65%); }
    .grid {
      position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 35% 50%, black 30%, transparent 75%);
    }
    .wrap { position: relative; display: flex; align-items: center; justify-content: space-between; height: 100%; padding: 0 80px; }

    .logo { font-size: 26px; font-weight: 800; color: #60a5fa; margin-bottom: 44px; }
    .badge { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px; border-radius: 999px; border: 1px solid rgba(34, 197, 94, 0.35); background: rgba(20, 83, 45, 0.3); color: #86efac; font-size: 20px; font-weight: 500; margin-bottom: 24px; }
    .badge i { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px #22c55e; }
    h1 { font-size: 92px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; background: linear-gradient(90deg, #2563eb, #60a5fa); -webkit-background-clip: text; color: transparent; padding-bottom: 6px; }
    .role { margin-top: 18px; font-size: 36px; font-weight: 600; color: #e5e7eb; }
    .stack { display: flex; gap: 12px; margin-top: 36px; }
    .stack span { font-size: 20px; font-weight: 500; padding: 8px 16px; border-radius: 10px; background: rgba(37, 99, 235, 0.15); border: 1px solid rgba(96, 165, 250, 0.25); color: #bfdbfe; }
    .url { margin-top: 40px; font-size: 20px; color: #9ca3af; }

    .photo { position: relative; flex-shrink: 0; }
    .photo::before { content: ''; position: absolute; inset: -18px; border-radius: 36px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); opacity: 0.45; filter: blur(28px); }
    .photo img { position: relative; display: block; width: 300px; height: 400px; object-fit: cover; object-position: center 18%; border-radius: 28px; border: 2px solid rgba(147, 197, 253, 0.3); }
  </style>
</head>
<body>
  <div class="glow-a"></div>
  <div class="glow-b"></div>
  <div class="grid"></div>
  <div class="wrap">
    <div>
      <div class="logo">&lt;Omar /&gt;</div>
      <div class="badge"><i></i>Open to new opportunities</div>
      <h1>Omar Amine</h1>
      <div class="role">Frontend Developer · Casablanca</div>
      <div class="stack"><span>React</span><span>Next.js</span><span>TypeScript</span><span>Tailwind CSS</span></div>
      <div class="url">omaramine.vercel.app</div>
    </div>
    <div class="photo"><img src="../client/public/images/profile.png" alt="" /></div>
  </div>
</body>
</html>
